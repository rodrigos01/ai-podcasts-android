name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-distribute:
    name: Build prod release APK and distribute via Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only used below to let `gcloud storage cp` read the app-build-secrets
      # bucket. export_environment_variables is off so GOOGLE_APPLICATION_CREDENTIALS
      # for bucket-reader@vola-common (a different GCP project than this app's
      # Firebase project) never leaks into the Gradle/Firebase App Distribution
      # step - that step authenticates solely via the serviceCredentialsFile
      # pulled from the bucket below, not via this impersonated identity.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/468058805150/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: bucket-reader@vola-common.iam.gserviceaccount.com
          export_environment_variables: false

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Pulls google-services.json, the release keystore, local.properties
      # (RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD)
      # and the Firebase App Distribution service credentials from the same
      # app-build-secrets/<owner>/<repo>/ layout the session-start hook uses,
      # mirrored onto the repo root.
      - name: Fetch build secrets from GCS
        env:
          GCS_SECRETS_BUCKET: app-build-secrets
        run: |
          gcloud storage cp --recursive "gs://${GCS_SECRETS_BUCKET}/${{ github.repository }}/*" .

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Distribute release via Firebase App Distribution
        run: ./gradlew appDistributionUploadRelease --no-daemon
